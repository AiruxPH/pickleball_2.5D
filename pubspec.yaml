name: pickleball_3d
description: "A 3D Pickleball mobile game built with Flutter and Flame engine."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # Game engine - stable, maintained, 60 FPS game loop
  flame: ^1.18.0

  # Audio integration for Flame
  flame_audio: ^2.10.0

  # State management
  provider: ^6.1.2

  # Persistent settings
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
